<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Badge for App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Arcane Concentric Circles -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-opacity="0.2" stroke-dasharray="10 8"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="145" fill="url(#glow)"/>

  <!-- D20 Polyhedron Center -->
  <g filter="url(#dropShadow)">
    <!-- Central Triangle -->
    <polygon points="256,128 375,324 137,324" fill="url(#purpleGrad)" stroke="#c7d2fe" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Top Left Face -->
    <polygon points="256,128 137,324 125,190" fill="#4338ca" stroke="#818cf8" stroke-width="2.5" opacity="0.95" stroke-linejoin="round"/>
    <!-- Top Right Face -->
    <polygon points="256,128 375,324 387,190" fill="#4f46e5" stroke="#818cf8" stroke-width="2.5" opacity="0.95" stroke-linejoin="round"/>
    
    <!-- Top Vertex Cap -->
    <polygon points="256,128 125,190 256,88 387,190" fill="#3730a3" stroke="#818cf8" stroke-width="2" opacity="0.9" stroke-linejoin="round"/>
    
    <!-- Bottom Triangles -->
    <polygon points="137,324 375,324 256,390" fill="#312e81" stroke="#6366f1" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="137,324 256,390 148,410" fill="#1e1b4b" stroke="#4f46e5" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="375,324 256,390 364,410" fill="#1e1b4b" stroke="#4f46e5" stroke-width="2" stroke-linejoin="round"/>

    <!-- Critical 20 Engraving -->
    <text x="256" y="272" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-weight="800" font-size="70" fill="#ffffff" text-anchor="middle" letter-spacing="-1">20</text>
  </g>

  <!-- Golden Quill / Tome Feather -->
  <g transform="translate(290, 175) rotate(22)" filter="url(#dropShadow)">
    <path d="M0,0 Q65,-45 130,-130 Q90,-45 55,-10 Q35,10 0,0 Z" fill="url(#goldGrad)"/>
    <path d="M0,0 L130,-130" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Subtle Magic Stars -->
  <polygon points="256,52 260,66 274,70 260,74 256,88 252,74 238,70 252,66" fill="#fbbf24"/>
  <polygon points="85,250 88,258 96,261 88,264 85,272 82,264 74,261 82,258" fill="#a5b4fc" opacity="0.8"/>
  <polygon points="427,250 430,258 438,261 430,264 427,272 424,264 416,261 424,258" fill="#a5b4fc" opacity="0.8"/>
</svg>
